<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Study Planner</title><link rel="stylesheet" href="style.css"></head><body><main><p class="tag">STUDENT WORKSPACE</p><h1>Study Planner</h1><p>Turn study intentions into a clear daily plan.</p><form id="taskForm"><input id="task" placeholder="What will you study?" required><input id="subject" placeholder="Subject / course"><input id="when" type="date" required><button>Add task</button></form><section class="summary"><b id="remaining">0</b> tasks remaining <b id="done">0</b> completed</section><div id="tasks"></div><p class="hint">Tasks are stored locally in this browser.</p></main><script src="app.js"></script></body></html>
